<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEP Saude</title>
    <link rel="stylesheet" href="style.css"></link>
    <script src="script.js" defer></script>
</head>

<body>
    <header id="cabecalho">
        <div id="logo">
            <img src="https://sc.ead.senai.br/pluginfile.php/1/theme_sctec/logocompact/300x300/1788866489/sketch%281%29.png"
                alt="logo do SAEP Saúde">
            <p id="descricao-empresa">Rede de atividades físicas</p>
        </div>
        <button id="botao-login-logout">Logout</button>
    </header>

    <div id="conteudo">
        <aside>
            <div id="perfil-info">
                <img id="perfil-foto"
                    src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png"
                    alt="foto do usuário">
                <h3>Nome completo do usuário</h3>
            </div>

            <div id="perfil-qntds">
                <div id="qntd-atividades">
                    <strong>1</strong>
                    <p>atividades</p>
                </div>

                <div id="qntd-calorias">
                    <strong>500</strong>
                    <p>calorias</p>
                </div>
            </div>

            <button id="perfil-btn-criar-atvd">Criar atividade</button>
        </aside>

        <main>
            <div id="filtros">
                <button data-tipo="corrida">Corrida</button>
                <button data-tipo="caminhada">Caminhada</button>
                <button data-tipo="trilha">Trilha</button>
                <button data-tipo="">Todos</button>
            </div>
        
            <div id="lista-atividades"></div>
        
            <div id="paginacao"></div>
        </main>
    </div>

    <footer>
    </footer>
</body>

</html>
